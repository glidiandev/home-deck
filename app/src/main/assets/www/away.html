<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Away screen</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/components.css">
<style>
  /* The screen saver (ScreenSaver.java): the home screen's away screen on its own, a dim clock that moves every 20
     seconds so nothing burns in, or the rainy city picked in Jump To > Screen saver. It reads only the home screen's
     own settings: the weather, and only when it is on. */
  html, body { background: #000; }
  .standby { position: absolute; inset: 0; background: var(--hd-c-void); opacity: 0;
             transition: opacity var(--hd-t-slow) var(--hd-ease-out); }
  .standby.on { opacity: 1; }
  .standby__pos { position: absolute; left: 0; top: 0; width: 760px; display: grid; gap: 10px; padding: 26px 34px; transition: opacity 600ms var(--hd-ease-in-out); }
  .standby__pos.fade { opacity: 0; }
  .standby__clock { color: var(--hd-chrome); font-size: 200px; text-shadow: var(--hd-glow-text); }
  .standby__clock .hd-num__frac { color: var(--hd-chrome-dim); }
  .standby__wx.is-stale { opacity: .5; }
  .rain { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
</style>
</head>
<body>
<div class="stage hd-root" id="stage">
  <div class="standby" id="standby" aria-hidden="true">
    <div class="standby__pos" id="sbPos">
      <span class="hd-label">Standby // screen rest</span>
      <span class="standby__clock hd-num hd-num--split"><span class="hd-num__int" id="sbHM">0:00</span><span class="hd-num__frac" id="sbAP">am</span></span>
      <span class="hd-label hd-label--meta" id="sbDate"></span>
      <span class="hd-label hd-label--meta standby__wx" id="sbWx" hidden></span>
      <span class="hd-hint" style="margin-top:14px"><span class="hd-key hd-key--word">OK</span>Any button wakes the screen</span>
    </div>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const two = n => String(n).padStart(2, '0');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = { get(k, d) { try { return JSON.parse(localStorage.getItem('homedeck-' + k)) ?? d; } catch { return d; } },
                  set(k, v) { try { localStorage.setItem('homedeck-' + k, JSON.stringify(v)); } catch {} } };

  // the 1920x1080 stage, scaled to the screen (clientWidth: a WebView can report a wider innerWidth)
  const stage = $('stage');
  const fit = () => { const de = document.documentElement, s = Math.min(de.clientWidth / 1920, de.clientHeight / 1080);
                      stage.style.transform = `translate(-50%, -50%) scale(${s})`; stage.classList.add('is-fit'); };
  addEventListener('resize', fit); fit();

  function tick() {
    const d = new Date(), h = d.getHours();
    $('sbHM').textContent = `${h % 12 || 12}:${two(d.getMinutes())}`; $('sbAP').textContent = h < 12 ? 'am' : 'pm';
    $('sbDate').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }
  tick(); setInterval(tick, 1000);

  const sbPos = $('sbPos');
  const spot = () => { sbPos.style.transform = `translate(${80 + Math.random() * 1000}px, ${80 + Math.random() * 560}px)`; };
  function drift() { if (reduce) return spot(); sbPos.classList.add('fade'); setTimeout(() => { spot(); sbPos.classList.remove('fade'); }, 650); }
  spot(); setInterval(drift, 20000);
  requestAnimationFrame(() => requestAnimationFrame(() => $('standby').classList.add('on')));

  // the home screen's Screen saver choice (Jump To): a rainy city instead of the clock, unless motion is turned down.
  // If this TV can't keep it smooth even when lighter, the rain says so and the clock comes back.
  const view = [null, 'window', 'downpour'][store.get('saver', 0)];
  if (view && !reduce) {
    const rain = document.createElement('iframe'); rain.className = 'rain'; rain.setAttribute('aria-hidden', 'true');
    rain.src = `rain/index.html?view=${view}`;
    stage.appendChild(rain); sbPos.hidden = true;
    addEventListener('message', e => { if (e.data && e.data.rain === 'too-slow' && e.source === rain.contentWindow) { rain.remove(); sbPos.hidden = false; } });
  }

  // Weather: only when it's switched on in the home screen (Jump To > Online extras), from the same service and
  // the same saved reading, refreshed every 30 minutes. Off, this page never calls the network.
  const WX = { on: !!store.get('wx-on', false), city: store.get('wx-city', null), unit: store.get('wx-unit', 'F') === 'C' ? 'C' : 'F',
               cache: store.get('wx-cache', null), stale: false };
  const WORDS = [[0, 0, 'Clear'], [1, 1, 'Mostly clear'], [2, 2, 'Partly cloudy'], [3, 3, 'Cloudy'], [45, 48, 'Fog'], [51, 57, 'Drizzle'],
                 [61, 67, 'Rain'], [71, 77, 'Snow'], [80, 82, 'Showers'], [85, 86, 'Snow'], [95, 99, 'Storm']];
  const word = c => (WORDS.find(([a, b]) => c >= a && c <= b) || [, , 'Cloudy'])[2];      // the home screen's names for the codes
  const deg = f => Math.round(WX.unit === 'C' ? (f - 32) * 5 / 9 : f);                   // always fetched in Fahrenheit
  function drawWx() {
    const el = $('sbWx'), c = WX.cache, show = WX.on && WX.city && c && c.city === WX.city.name;
    el.hidden = !show;
    if (!show) return;
    el.textContent = `${deg(c.temp)}°${WX.unit} // ${word(c.code)} // ${c.city}`;
    el.classList.toggle('is-stale', WX.stale || Date.now() - c.t > 90 * 60000);
  }
  async function wxFetch() {
    if (!WX.on || !WX.city) return;
    const { lat, lon, name } = WX.city;
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`;
    try {
      const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      WX.cache = { t: Date.now(), city: name, temp: j.current.temperature_2m, code: j.current.weather_code, hi: j.daily.temperature_2m_max[0], lo: j.daily.temperature_2m_min[0] };
      WX.stale = false; store.set('wx-cache', WX.cache);
    } catch { WX.stale = true; }                              // offline: keep the last reading, dimmed
    drawWx();
  }
  drawWx();
  if (WX.on && !(WX.cache && WX.cache.city === WX.city?.name && Date.now() - WX.cache.t < 30 * 60000)) wxFetch();
  setInterval(wxFetch, 30 * 60000);
})();
</script>
</body>
</html>
